[package]
name = "lirrly"
version = "0.3.0"
description = "Lirrly — voice dictation"
authors = ["mshrmnsr"]
license = "MIT"
edition = "2021"

[lib]
name = "lirrly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "rustls-tls"] }
base64 = "0.22"
enigo = "0.3"
tauri-plugin-store = "2.4.3"
keyring = { version = "3", features = ["apple-native"] }
tokio = { version = "1.52.3", features = ["time", "sync"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.3.3"

[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.2"

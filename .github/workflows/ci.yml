name: CI

on:
  push:
    branches: ["main", "open-source-wispr-flow-clone"]
  pull_request:

jobs:
  architecture:
    name: Architecture drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/architecture.py --check --scope public

  frontend:
    name: Frontend (build · lint · test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lirrly/package-lock.json
      - run: npm ci
        working-directory: lirrly
      - run: npm run build
        working-directory: lirrly
      - run: npm run lint
        working-directory: lirrly
      - run: npm test
        working-directory: lirrly

  # Same commands as the release gates in scripts/release.sh, so a green CI run
  # means the release gates will pass too. `cargo check` alone never ran a test.
  rust:
    name: Rust app (fmt · clippy · test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lirrly/src-tauri
      - run: cargo fmt --check
        working-directory: lirrly/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: lirrly/src-tauri
      - run: cargo test
        working-directory: lirrly/src-tauri

  # lirrly-core is a path dependency: building or testing the app compiles it
  # but never runs its own tests, which cover the Groq request/response handling.
  core:
    name: Rust core (fmt · clippy · test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/lirrly-core
      - run: cargo fmt --check
        working-directory: crates/lirrly-core
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: crates/lirrly-core
      - run: cargo test
        working-directory: crates/lirrly-core

name: CI

on:
  push:
    branches: ["main", "open-source-wispr-flow-clone"]
  pull_request:

jobs:
  frontend:
    name: Frontend (build · lint · test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lirrly/package-lock.json
      - run: npm ci
        working-directory: lirrly
      - run: npm run build
        working-directory: lirrly
      - run: npm run lint
        working-directory: lirrly
      - run: npm test
        working-directory: lirrly

  rust:
    name: Rust (check · fmt · clippy)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lirrly/src-tauri
      - run: cargo check
        working-directory: lirrly/src-tauri
      - run: cargo fmt --check
        working-directory: lirrly/src-tauri
      - run: cargo clippy -- -D warnings
        working-directory: lirrly/src-tauri
